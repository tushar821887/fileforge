  <!-- Google Consent Mode v2 (Strict Google Ads & EU User Consent Policy Compliance) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Initialize Google Consent Mode v2 default state as 'denied'
    // Updated dynamically via FormatFlow Cookie Consent Manager when the user chooses their preferences
    try {
      var savedConsent = localStorage.getItem('formatflow_cookie_consent');
      if (savedConsent) {
        var consentObj = JSON.parse(savedConsent);
        gtag('consent', 'default', {
          'analytics_storage': consentObj.analytics ? 'granted' : 'denied',
          'ad_storage': consentObj.advertising ? 'granted' : 'denied',
          'ad_user_data': consentObj.advertising ? 'granted' : 'denied',
          'ad_personalization': consentObj.advertising ? 'granted' : 'denied',
          'wait_for_update': 500
        });
      } else {
        gtag('consent', 'default', {
          'analytics_storage': 'denied',
          'ad_storage': 'denied',
          'ad_user_data': 'denied',
          'ad_personalization': 'denied',
          'wait_for_update': 500
        });
      }
    } catch(e) {
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
    }
    gtag('set', 'ads_data_redaction', true);
  </script>
